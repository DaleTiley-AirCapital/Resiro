services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rezdna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rezdna"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/RezDNA.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=rezdna;Username=postgres;Password=password
      JWT__SecretKey: local-development-secret-change-me
      DATABASE__ENSURE_CREATED: "true"
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_DEV_PROXY_TARGET: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
