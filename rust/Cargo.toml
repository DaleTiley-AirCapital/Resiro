[package]
name = "resiro"
version = "2.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart","form","json"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls","postgres","uuid","chrono","json","migrate","macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","json","multipart","stream"] }
rusty-s3 = "0.10"
uuid = { version = "1", features = ["v4","serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
bcrypt = "0.17"
subtle = "2"
tower-http = { version = "0.6", features = ["fs","limit","trace","set-header"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
mailparse = "0.15"
cfb = "0.10"
regex = "1"
url = "2"
tempfile = "3"
futures-util = "0.3"
base64 = "0.22"
