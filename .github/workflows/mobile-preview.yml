name: Mobile preview builds
on:
  push:
    branches: [codex/rust-property-platform]
    paths: ['mobile/**', '.github/workflows/mobile-preview.yml', 'rust/public/app.css']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile
          cache-on-failure: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install verified Dioxus CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dx"
          gh release download v0.7.0 --repo DioxusLabs/dioxus --pattern dx-x86_64-unknown-linux-gnu.tar.gz --pattern dx-x86_64-unknown-linux-gnu.sha256 --dir "$RUNNER_TEMP/dx"
          cd "$RUNNER_TEMP/dx"
          grep 'tar.gz$' dx-x86_64-unknown-linux-gnu.sha256 | sha256sum -c -
          tar xzf dx-x86_64-unknown-linux-gnu.tar.gz
          echo "$RUNNER_TEMP/dx" >> "$GITHUB_PATH"
      - name: Build installable Android preview
        working-directory: mobile
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          dx build --android --target aarch64-linux-android
      - name: Prepare Android device checks
        working-directory: mobile
        run: |
          mkdir -p previews
          APK="$(find target/dx/resiro/debug/android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" previews/Resiro-android-arm64.apk
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          dx build --android --target x86_64-linux-android
          APK="$(find target/dx/resiro/debug/android -type f -name '*.apk' -print -quit)"
          cp "$APK" previews/Resiro-android-emulator.apk
      - name: Enable Android emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Launch Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 mobile/scripts/android_smoke.py mobile/previews/Resiro-android-emulator.apk
      - name: Preserve Android preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resiro-android-preview
          path: |
            mobile/previews/*.apk
            mobile/previews/*.png
            mobile/previews/*.json
            mobile/previews/*.xml
            mobile/previews/*.txt
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile
          cache-on-failure: true
      - name: Install verified Dioxus CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dx"
          ARCH="$(uname -m)"
          if [ "$ARCH" = arm64 ]; then TRIPLE=aarch64-apple-darwin; else TRIPLE=x86_64-apple-darwin; fi
          gh release download v0.7.0 --repo DioxusLabs/dioxus --pattern "dx-$TRIPLE.tar.gz" --pattern "dx-$TRIPLE.sha256" --dir "$RUNNER_TEMP/dx"
          cd "$RUNNER_TEMP/dx"
          grep 'tar.gz$' "dx-$TRIPLE.sha256" | shasum -a 256 -c -
          tar xzf "dx-$TRIPLE.tar.gz"
          echo "$RUNNER_TEMP/dx" >> "$GITHUB_PATH"
      - name: Build iOS simulator preview
        working-directory: mobile
        run: dx build --ios --target aarch64-apple-ios-sim
      - name: Launch iOS simulator application
        working-directory: mobile
        run: |
          APP="target/dx/resiro/debug/ios/Resiro.app"
          test -n "$APP"
          mkdir -p previews
          tar -chzf previews/Resiro-ios-simulator.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if v["name"].startswith("iPhone")))')"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$APP"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl launch "$SIM_ID" "$BUNDLE"
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot previews/Resiro-ios-simulator.png
      - name: Preserve simulator application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resiro-ios-simulator-preview
          path: mobile/previews/*
          if-no-files-found: error
