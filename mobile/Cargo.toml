[package]
name = "resiro-mobile"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.0", features = ["mobile"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
url = "2"
base64 = "0.22"

[features]
default = ["mobile"]
mobile = []
